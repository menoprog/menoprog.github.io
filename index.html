<head>

<title>뇌스낵 업로더</title>
<style>
  :root { --bg:#ffffff; --fg:#111111; --muted:#555555; --line:#e5e5e5; --accent:#c8102e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111111; --fg:#f2f2f2; --muted:#b0b0b0; --line:#333333; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; line-height:1.6; }
  main { max-width:680px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 32px; }
  ul { padding-left:20px; }
  a { color:var(--accent); }
  footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>뇌스낵 업로더</h1>
  <p class="sub">유튜브 채널 「뇌스낵」의 숏폼 영상을 자동으로 만들고 예약 업로드하는 운영자 전용 도구입니다.</p>

  <h2>무엇을 하나요</h2>
  <ul>
    <li>매일 정해진 시각에 뉴스 소재로 30초 안팎의 숏폼 영상을 만듭니다.</li>
    <li>완성된 영상을 YouTube Data API 로 채널에 예약 업로드합니다.</li>
    <li>공개된 영상에 시청자 질문 댓글을 하나 답니다.</li>
  </ul>

  <h2>누가 쓰나요</h2>
  <p>채널 운영자 한 사람만 사용합니다. 일반 사용자에게 제공되는 서비스가 아니며, 다른 사람의 Google 계정에는 접근하지 않습니다.</p>

  <p><a href="privacy.html">개인정보처리방침</a></p>

  <footer>© 뇌스낵</footer>
</main>
